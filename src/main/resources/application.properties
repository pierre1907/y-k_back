spring.application.name=yk-back
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/yk_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Security
spring.security.require-ssl=false

# Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Server
server.port=${PORT:8080}
server.servlet.context-path=/api

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# App custom properties
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@yk-platform.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin@YK2024!}
app.seed.admin-name=${SEED_ADMIN_NAME:Super Admin}
app.jwt.secret=${JWT_SECRET:change-me-in-production-min-256-bits-secret-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.mail.from=${MAIL_FROM:noreply@yk-platform.com}
app.mail.from-name=${MAIL_FROM_NAME:Y&K Platform}
app.mail.base-url=${APP_BASE_URL:http://localhost:3000}

# SpringDoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
